name: Refresh statistics

# Once a month, check every source for a newer edition. If there is one, fetch it, rebuild the data, run the checks
# and open a PR with a summary of what changed. A source whose layout has changed fails the build (and so this job),
# and no PR is opened.
on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci

      - name: Skip if a refresh PR is already open
        id: open
        run: echo "count=$(gh pr list --state open --search 'head:data/refresh-' --json number --jq length)" >> "$GITHUB_OUTPUT"

      - name: Check for newer editions
        id: check
        if: steps.open.outputs.count == '0'
        run: node scripts/data/refresh.ts

      - name: Fetch and rebuild
        if: steps.check.outputs.changed == 'true'
        run: npm run data:fetch && npm run data:build

      - name: Check the rebuilt data
        if: steps.check.outputs.changed == 'true'
        run: npm run typecheck && npm run lint && npm test

      - name: Open a PR
        if: steps.check.outputs.changed == 'true'
        env:
          CHANGES: ${{ steps.check.outputs.changes }}
        run: |
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add scripts/data/editions.json src/data public/data
          git commit -m "Refresh statistics" -m "$CHANGES"
          git push -u origin "$branch"
          {
            echo "The monthly check found newer statistics."
            echo
            echo "$CHANGES" | sed 's/^/- /'
            echo
            echo "**What changed in the figures**"
            echo
            node scripts/data/summary.ts
            echo
            echo "Built and checked by the Refresh statistics workflow (typecheck, lint, unit tests). Review the figures, then ship it."
          } > body.md
          gh pr create --base gh-pages --head "$branch" --title "Refresh statistics ($(date -u '+%B %Y'))" --body-file body.md
          # PRs opened with the workflow token don't start CI; a dispatch does, and its checks count for this commit.
          gh workflow run ci.yml --ref "$branch"
