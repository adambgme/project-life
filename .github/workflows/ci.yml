name: CI

on:
  pull_request:
  workflow_call:
  # The monthly data refresh starts CI on its PR branch this way: GitHub doesn't run workflows for a PR opened with
  # the workflow's own token, but a dispatch does run, and its checks count for the PR's head commit.
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. A run called by Deploy (a merge) gets its own group, so it is never cancelled
# or dropped from the queue by a later merge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # Playwright's image has the browsers and their system libraries, so nothing is installed with apt (that step
    # once took 10 minutes on a slow mirror). Keep the tag in step with @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm }
      - run: npm ci
      - run: npm run e2e
        env: { CI: "true", HOME: /root }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
